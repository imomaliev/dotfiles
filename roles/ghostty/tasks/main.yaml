- name: Install
  tags: [install]
  homebrew_cask: name=ghostty update_homebrew=yes
- name: Link terminfo
  tags: [terminfo]
  block:
    - name: Ensure terminfo/78 folder exists
      file:
        path: ~/.local/share/terminfo/78/
        state: directory
        mode: "0755"
    - name: Link xterm-ghostty terminfo
      file:
        src: "/Applications/Ghostty.app/Contents/Resources/terminfo/78/xterm-ghostty"
        dest: ~/.local/share/terminfo/78/xterm-ghostty
        state: link
    - name: Ensure terminfo/67 folder exists
      file:
        path: ~/.local/share/terminfo/67/
        state: directory
        mode: "0755"
    - name: Link ghostty terminfo
      file:
        src: "/Applications/Ghostty.app/Contents/Resources/terminfo/78/xterm-ghostty"
        dest: ~/.local/share/terminfo/67/ghostty
        state: link
- name: Link configs
  tags: [config]
  file:
    src: "{{ playbook_dir }}/roles/ghostty/files"
    dest: ~/.config/ghostty
    state: link
